<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="FUNdamental AI Lab Quiz - participant accounts, practice tests, and admin monitoring.">
<title>FUNdamental AI Lab Quiz</title>
<style>
/* ============================================================
   FUNdamental AI Lab Quiz
   Single-file app. Questions are loaded verbatim from the
   course CSV files in the test/ folder.
   ============================================================ */
:root {
  --primary: #0d7c6c;
  --primary-dark: #065a4e;
  --primary-light: #e0f5f1;
  --primary-glow: rgba(13,124,108,.16);
  --accent: #2e7d32;
  --accent-soft: #e8f5e9;
  --correct: #1b7f3a;
  --correct-bg: #e6f6eb;
  --wrong: #b42318;
  --wrong-bg: #fdecea;
  --warn: #9a6700;
  --warn-bg: #fff4d6;
  --text: #172b2f;
  --text-soft: #5c7277;
  --bg: #f3f7f5;
  --card: #ffffff;
  --border: #cfddd8;
  --shadow: 0 8px 28px rgba(13,124,108,.09);
  --radius: 14px;
  --radius-sm: 9px;
  --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --header: linear-gradient(135deg, #064c42, #0d7c6c 70%, #159685);
  --header-text: #ffffff;
  --input-bg: #ffffff;
  --sidebar: #eef5f2;
  --overlay: rgba(9,24,22,.56);
  --code: #0e3b34;
}
body.dark {
  --primary: #3dd6c0;
  --primary-dark: #8ff0e0;
  --primary-light: #143a34;
  --primary-glow: rgba(61,214,192,.18);
  --accent: #79d17e;
  --accent-soft: #17351d;
  --correct: #75d68c;
  --correct-bg: #17351f;
  --wrong: #ff8b80;
  --wrong-bg: #3a1c1a;
  --warn: #ffd166;
  --warn-bg: #3a2c10;
  --text: #e6f0ed;
  --text-soft: #a7bbb6;
  --bg: #0e1715;
  --card: #17231f;
  --border: #2a3f39;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --header: linear-gradient(135deg, #032b25, #064c42 70%, #0a5f53);
  --header-text: #ecfffb;
  --input-bg: #12201c;
  --sidebar: #111d19;
  --overlay: rgba(0,0,0,.72);
  --code: #07100e;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.55;
  transition: background .2s, color .2s;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

/* ---------- header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  padding: 11px 22px;
  color: var(--header-text);
  background: var(--header);
  box-shadow: 0 2px 14px rgba(0,0,0,.16);
}
.brand { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.26);
  font-weight: 800; letter-spacing: .04em; font-size: .85rem;
}
.brand-title { font-weight: 700; font-size: 1.02rem; line-height: 1.15; }
.brand-sub { font-size: .7rem; opacity: .78; letter-spacing: .08em; text-transform: uppercase; }
.header-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.header-user { font-size: .78rem; opacity: .9; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn, .lang-btn, .ghost-btn {
  border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.11);
  color: var(--header-text);
  border-radius: 999px; padding: 5px 11px; font-size: .76rem;
  transition: background .15s, border-color .15s;
}
.icon-btn:hover, .lang-btn:hover, .ghost-btn:hover { background: rgba(255,255,255,.23); }
.lang-btn.active { background: #fff; color: #064c42; border-color: #fff; font-weight: 700; }
.admin-chip { background: rgba(255,209,102,.18); border-color: rgba(255,209,102,.45); font-weight: 700; }

/* ---------- layout ---------- */
.app-main { width: 100%; max-width: 1180px; margin: 0 auto; padding: 26px 18px 58px; flex: 1; }
.app-main.admin-wide { max-width: 1380px; }
.app-footer { text-align: center; color: var(--text-soft); font-size: .75rem; padding: 16px 20px 22px; }
.page-narrow { max-width: 980px; margin: 0 auto; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 24px;
}
.card + .card { margin-top: 16px; }
.card-title { margin: 0 0 5px; font-size: 1.18rem; color: var(--text); letter-spacing: -.01em; }
.card-sub { margin: 0 0 18px; color: var(--text-soft); font-size: .88rem; }
.section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.section-head h2, .section-head h3 { margin: 0; font-size: 1.08rem; }
.section-head p { margin: 3px 0 0; color: var(--text-soft); font-size: .82rem; }
hr.divider { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid transparent; border-radius: 9px;
  padding: 10px 16px; font-weight: 650; font-size: .88rem;
  text-decoration: none; transition: transform .08s, background .15s, border-color .15s, opacity .15s;
  white-space: nowrap;
}
.btn:hover { text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); }
.btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
.btn-outline:hover { background: var(--primary-light); border-color: var(--primary); }
.btn-danger { background: var(--wrong-bg); color: var(--wrong); border-color: var(--wrong-bg); }
.btn-warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bg); }
.btn-sm { padding: 6px 11px; font-size: .77rem; border-radius: 7px; }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- forms ---------- */
.field { margin-bottom: 15px; }
.field label { display: block; font-size: .8rem; font-weight: 700; color: var(--text); margin-bottom: 5px; }
.field label .req { color: var(--wrong); }
.field input[type=text], .field input[type=password], .field input[type=email],
.field input[type=number], .field input[type=datetime-local], .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: 8px; background: var(--input-bg); color: var(--text);
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
}
.field .hint { font-size: .73rem; color: var(--text-soft); margin-top: 4px; }
.field .err { font-size: .76rem; color: var(--wrong); margin-top: 4px; display: none; }
.field.invalid input { border-color: var(--wrong); }
.field.invalid .err { display: block; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 62px !important; }
.pw-toggle {
  position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--text-soft); font-size: .72rem; padding: 5px 8px;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 620px) { .form-grid { grid-template-columns: 1fr; } }
.check-row { display: flex; align-items: flex-start; gap: 8px; font-size: .82rem; color: var(--text-soft); margin: 12px 0 14px; }
.check-row input { margin-top: 4px; accent-color: var(--primary); }
.alert { border-radius: 9px; padding: 10px 13px; font-size: .82rem; margin: 0 0 14px; border: 1px solid transparent; }
.alert-error { background: var(--wrong-bg); color: var(--wrong); border-color: var(--wrong-bg); }
.alert-warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bg); }
.alert-info { background: var(--primary-light); color: var(--primary-dark); border-color: var(--primary-light); }
.alert-success { background: var(--correct-bg); color: var(--correct); border-color: var(--correct-bg); }

/* ---------- auth ---------- */
.auth-shell { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 22px; align-items: stretch; }
.auth-card { padding: 30px; }
.auth-hero {
  border-radius: var(--radius); padding: 32px;
  color: #eafffb; background:
    radial-gradient(circle at 85% 15%, rgba(255,255,255,.18), transparent 35%),
    radial-gradient(circle at 10% 90%, rgba(46,125,50,.32), transparent 42%),
    linear-gradient(145deg, #042f2a, #075248 55%, #0d7c6c);
  box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between;
}
.auth-hero h1 { margin: 0 0 8px; font-size: 1.85rem; line-height: 1.15; letter-spacing: -.03em; }
.auth-hero p { margin: 0; color: rgba(234,255,251,.82); font-size: .9rem; }
.auth-hero .hero-list { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 10px; }
.auth-hero .hero-list li { display: flex; gap: 9px; font-size: .84rem; color: rgba(234,255,251,.9); }
.auth-hero .hero-list b { color: #fff; }
.auth-hero .hero-badge { display: inline-flex; align-items: center; gap: 6px; width: fit-content; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); border-radius: 999px; padding: 4px 11px; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
.auth-tabs { display: flex; gap: 5px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.auth-tab { flex: 1; border: 0; background: transparent; color: var(--text-soft); padding: 8px 10px; border-radius: 7px; font-size: .82rem; font-weight: 650; }
.auth-tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.auth-foot { margin-top: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .77rem; color: var(--text-soft); }
.link-btn { border: 0; padding: 0; background: transparent; color: var(--primary); font-weight: 650; font-size: inherit; text-decoration: underline; }
@media (max-width: 860px) { .auth-shell { grid-template-columns: 1fr; } .auth-hero { min-height: 220px; } }

/* ---------- dashboard ---------- */
.dash-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.dash-head h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.03em; }
.dash-head p { margin: 4px 0 0; color: var(--text-soft); font-size: .86rem; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 850px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 11px; }
.stat {
  border: 1px solid var(--border); background: var(--card); border-radius: 10px; padding: 13px 14px;
}
.stat .num { font-size: 1.45rem; font-weight: 750; letter-spacing: -.02em; color: var(--primary-dark); }
body.dark .stat .num { color: var(--primary); }
.stat .label { font-size: .73rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .04em; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: .69rem; font-weight: 750; letter-spacing: .02em; white-space: nowrap; }
.badge-open { background: var(--correct-bg); color: var(--correct); }
.badge-closed { background: var(--wrong-bg); color: var(--wrong); }
.badge-practice { background: var(--primary-light); color: var(--primary-dark); }
.badge-real { background: var(--warn-bg); color: var(--warn); }
.badge-muted { background: var(--sidebar); color: var(--text-soft); }
.set-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--card); }
.set-card .set-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.set-card h3 { margin: 0; font-size: .96rem; }
.set-card p { margin: 0; font-size: .78rem; color: var(--text-soft); }
.set-card .score-line { font-size: .84rem; font-weight: 700; }
.result-list { display: grid; gap: 8px; }
.result-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: .8rem; }
.result-row .meta { color: var(--text-soft); font-size: .72rem; }
.empty { text-align: center; color: var(--text-soft); padding: 24px 12px; font-size: .84rem; }
.schedule-note { font-size: .78rem; color: var(--text-soft); }
.notice-bar { border: 1px solid var(--border); background: var(--sidebar); color: var(--text-soft); border-radius: 10px; padding: 10px 13px; font-size: .8rem; margin-bottom: 16px; }

/* ---------- test ---------- */
.test-layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 17px; align-items: start; }
@media (max-width: 900px) { .test-layout { grid-template-columns: 1fr; } .test-side { order: 2; } }
.test-main { min-width: 0; }
.test-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.test-top .left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.timer-box { display: flex; align-items: baseline; gap: 7px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); }
.timer-box .time { font-variant-numeric: tabular-nums; font-size: 1.18rem; font-weight: 800; letter-spacing: .03em; color: var(--primary-dark); }
body.dark .timer-box .time { color: var(--primary); }
.timer-box.warn .time { color: var(--warn); }
.timer-box.danger .time { color: var(--wrong); }
.timer-box .lbl { font-size: .65rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: .05em; }
.save-status { font-size: .72rem; color: var(--text-soft); }
.progress-wrap { margin-bottom: 15px; }
.progress-meta { display: flex; justify-content: space-between; font-size: .75rem; color: var(--text-soft); margin-bottom: 5px; }
.progress-track { height: 7px; background: var(--border); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--accent)); transition: width .2s; }
.question-meta { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-bottom: 10px; }
.question-meta .qno { font-size: .76rem; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--primary); }
.flag-btn { border: 1px solid var(--border); background: var(--card); color: var(--text-soft); border-radius: 7px; padding: 4px 9px; font-size: .78rem; }
.flag-btn.flagged { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.question-text { font-size: 1.04rem; font-weight: 650; line-height: 1.5; margin: 0 0 16px; }
.options { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.option { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--border); border-radius: 9px; padding: 11px 13px; cursor: pointer; background: var(--card); transition: border-color .15s, background .15s; }
.option:hover { border-color: var(--primary); background: var(--primary-light); }
.option.selected { border-color: var(--primary); background: var(--primary-light); box-shadow: 0 0 0 1px var(--primary) inset; }
.option input { margin-top: 3px; accent-color: var(--primary); }
.option .letter { font-weight: 800; color: var(--primary); min-width: 18px; }
.option .txt { font-size: .88rem; }
.test-nav { display: flex; justify-content: space-between; gap: 9px; margin-top: 18px; flex-wrap: wrap; }
.side-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px; }
.side-card h3 { margin: 0 0 10px; font-size: .84rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-soft); }
.q-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.q-dot { border: 1px solid var(--border); background: var(--card); color: var(--text-soft); border-radius: 6px; padding: 5px 0; font-size: .7rem; font-weight: 650; }
.q-dot.answered { background: var(--primary); border-color: var(--primary); color: #fff; }
.q-dot.current { outline: 2px solid var(--accent); outline-offset: 1px; }
.q-dot.flagged { border-color: var(--warn); color: var(--warn); }
.legend { display: grid; gap: 5px; font-size: .69rem; color: var(--text-soft); margin-top: 12px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--border); display: inline-block; }
.legend .a { background: var(--primary); border-color: var(--primary); }
.legend .f { border-color: var(--warn); }
.review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.review-card { border: 1px solid var(--border); border-radius: 8px; padding: 9px; cursor: pointer; background: var(--card); }
.review-card.answered { border-left: 4px solid var(--primary); }
.review-card.flagged { outline: 1px solid var(--warn); }
.review-card .rn { font-size: .72rem; font-weight: 750; color: var(--text-soft); }
.review-card .rq { font-size: .76rem; margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ---------- result ---------- */
.result-hero { text-align: center; padding: 8px 0 4px; }
.score-circle { width: 132px; height: 132px; border-radius: 50%; margin: 8px auto 12px; display: grid; place-items: center; font-size: 2.2rem; font-weight: 800; letter-spacing: -.04em; border: 8px solid var(--border); background: var(--card); }
.score-circle.pass { color: var(--correct); border-color: var(--correct); background: var(--correct-bg); }
.score-circle.fail { color: var(--wrong); border-color: var(--wrong); background: var(--wrong-bg); }
.score-circle.mid { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
.result-label { font-size: 1.2rem; font-weight: 750; }
.result-sub { color: var(--text-soft); font-size: .85rem; margin-top: 3px; }
.result-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.breakdown { display: grid; gap: 10px; margin-top: 16px; }
.bq { border: 1px solid var(--border); border-radius: 9px; padding: 12px 13px; background: var(--card); }
.bq .bq-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
.bq .bq-status { font-size: .72rem; font-weight: 750; }
.bq .bq-status.ok { color: var(--correct); }
.bq .bq-status.no { color: var(--wrong); }
.bq .bq-text { font-size: .86rem; font-weight: 650; margin-bottom: 7px; }
.bq ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.bq li { font-size: .78rem; color: var(--text-soft); border-radius: 5px; padding: 4px 7px; }
.bq li.correct { background: var(--correct-bg); color: var(--correct); font-weight: 650; }
.bq li.wrong { background: var(--wrong-bg); color: var(--wrong); font-weight: 650; }
.bq li.chosen { outline: 1px solid currentColor; }

/* ---------- admin ---------- */
.admin-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 17px; align-items: start; }
@media (max-width: 900px) { .admin-layout { grid-template-columns: 1fr; } .admin-nav { display: flex; overflow-x: auto; gap: 5px; padding: 5px; } .admin-nav button { white-space: nowrap; } }
.admin-nav { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px; position: sticky; top: 74px; }
.admin-nav button { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--text-soft); text-align: left; padding: 9px 10px; border-radius: 7px; font-size: .82rem; font-weight: 600; }
.admin-nav button:hover { background: var(--primary-light); color: var(--text); }
.admin-nav button.active { background: var(--primary); color: #fff; }
.admin-nav button .ico { width: 18px; text-align: center; }
.admin-content { min-width: 0; }
.admin-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
.admin-top h1 { margin: 0; font-size: 1.35rem; letter-spacing: -.03em; }
.admin-top p { margin: 3px 0 0; font-size: .82rem; color: var(--text-soft); }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
table.data { width: 100%; border-collapse: collapse; font-size: .79rem; min-width: 650px; }
table.data th { background: var(--sidebar); color: var(--text-soft); font-size: .67rem; text-transform: uppercase; letter-spacing: .05em; text-align: left; padding: 9px 10px; white-space: nowrap; border-bottom: 1px solid var(--border); }
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.data tr:last-child td { border-bottom: 0; }
table.data tr:hover td { background: var(--primary-light); }
table.data .empty-row td { text-align: center; color: var(--text-soft); padding: 26px; }

.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .74rem; }
.muted { color: var(--text-soft); }
.nowrap { white-space: nowrap; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 9px; margin-bottom: 14px; }
.detail-box { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--sidebar); }
.detail-box .k { font-size: .65rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-soft); }
.detail-box .v { font-size: .83rem; font-weight: 650; margin-top: 2px; word-break: break-word; }
.dist { display: grid; gap: 5px; margin-top: 8px; }
.dist-row { display: grid; grid-template-columns: 54px 1fr 30px; gap: 7px; align-items: center; font-size: .7rem; color: var(--text-soft); }
.dist-track { height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; }
.dist-fill { height: 100%; background: var(--primary); border-radius: 99px; }
.setting-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 680px) { .setting-grid { grid-template-columns: 1fr; } }
.bank-q { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 7px; background: var(--card); }
.bank-q summary { cursor: pointer; padding: 9px 11px; font-size: .8rem; font-weight: 650; }
.bank-q .bank-body { padding: 0 12px 11px; border-top: 1px solid var(--border); }
.bank-q ol { margin: 8px 0 0; padding-left: 18px; font-size: .77rem; color: var(--text-soft); }
.bank-q li.ok { color: var(--correct); font-weight: 700; }
.bank-q .src { font-size: .68rem; color: var(--text-soft); margin-top: 4px; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 7px; font-size: .66rem; font-weight: 700; background: var(--sidebar); color: var(--text-soft); }

/* ---------- modal / toast ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 200; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; padding: 28px 14px; overflow-y: auto; }
.modal { width: 100%; max-width: 600px; background: var(--card); border: 1px solid var(--border); border-radius: 15px; box-shadow: 0 24px 70px rgba(0,0,0,.35); padding: 22px; }
.modal.wide { max-width: 860px; }
.modal h3 { margin: 0 0 7px; font-size: 1.1rem; }
.modal p { color: var(--text-soft); font-size: .86rem; }
.modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 17px; }
.modal .modal-actions.split { justify-content: space-between; }
.modal .close-x { float: right; border: 0; background: transparent; color: var(--text-soft); font-size: 1.2rem; line-height: 1; }
.tc-list { margin: 10px 0 0; padding-left: 19px; color: var(--text-soft); font-size: .82rem; display: grid; gap: 6px; }
.temp-pw { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--sidebar); border: 1px dashed var(--primary); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.temp-pw code { font-size: 1.05rem; font-weight: 800; letter-spacing: .04em; color: var(--primary-dark); word-break: break-all; }
body.dark .temp-pw code { color: var(--primary); }
.toast-root { position: fixed; right: 16px; top: 74px; z-index: 300; display: grid; gap: 7px; max-width: 340px; }
.toast { border-radius: 9px; padding: 10px 13px; color: #fff; background: #173c36; box-shadow: 0 8px 20px rgba(0,0,0,.22); font-size: .8rem; animation: slideIn .18s ease; }
.toast.err { background: #9c2b20; }
.toast.ok { background: #176b3a; }
.toast.warn { background: #8a5c08; }
@keyframes slideIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }

/* ---------- misc ---------- */
.small { font-size: .76rem; color: var(--text-soft); }
.tiny { font-size: .68rem; color: var(--text-soft); }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: .74rem; background: var(--sidebar); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
.spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -2px; }
.spinner.dark { border-color: var(--border); border-top-color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }
.center { text-align: center; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-18 { margin-top: 18px; }
.mb-0 { margin-bottom: 0; }
@media print {
  .app-header, .app-footer, .no-print, .admin-nav, .test-side, .btn { display: none !important; }

  .card { box-shadow: none; border: 1px solid #bbb; break-inside: avoid; }
  .app-main { max-width: 100%; padding: 0; }
}

/* ============================================================

   ============================================================ */
function $(id) { return document.getElementById(id); }
function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
  });
}
function t(en, id) { return state.lang === "en" ? en : id; }
function tsToMs(value) {
  if (!value) return 0;
  if (typeof value === "number") return value;
  if (typeof value.toMillis === "function") return value.toMillis();
  if (typeof value.toDate === "function") return value.toDate().getTime();
  var parsed = new Date(value).getTime();
  return isNaN(parsed) ? 0 : parsed;
}
function fmtDate(value, withTime) {
  var ms = tsToMs(value);
  if (!ms) return "—";
  var d = new Date(ms);
  var opts = { day: "2-digit", month: "short", year: "numeric" };
  if (withTime !== false) { opts.hour = "2-digit"; opts.minute = "2-digit"; }
  return d.toLocaleString(state.lang === "en" ? "en-GB" : "id-ID", opts);
}
function fmtShortDate(value) {
  var ms = tsToMs(value);
  if (!ms) return "—";
  return new Date(ms).toLocaleString(state.lang === "en" ? "en-GB" : "id-ID", {
    weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
  });
}
function fmtDuration(seconds) {
  if (seconds == null || isNaN(seconds)) return "—";
  seconds = Math.max(0, Math.round(seconds));
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  return m + "m " + (s < 10 ? "0" : "") + s + "s";
}
function normalizeNim(raw) {
  return String(raw || "").trim().replace(/\s+/g, "").toUpperCase();
}
function validNim(nim) {
  return /^[A-Z0-9]{6,20}$/.test(nim);
}
function validPassword(pw) {
  return typeof pw === "string" && pw.length >= 8 && /[A-Za-z]/.test(pw) && /[0-9]/.test(pw);
}
function randomToken(length) {
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
  var out = "";
  var arr = new Uint32Array(length || 12);
  if (window.crypto && window.crypto.getRandomValues) {
    window.crypto.getRandomValues(arr);
    for (var i = 0; i < arr.length; i++) out += chars[arr[i] % chars.length];
  } else {
    for (var j = 0; j < (length || 12); j++) out += chars[Math.floor(Math.random() * chars.length)];
  }
  return out;
}
function participantEmail(nim) {
  return "p." + nim.toLowerCase() + "." + Date.now().toString(36) + "." + randomToken(5).toLowerCase() + "@student.fundai.local";
}
function tempPassword() {
  return "Fai-" + randomToken(8) + Math.floor(10 + Math.random() * 89);
}
function toast(message, kind) {
  var root = $("toastRoot");
  if (!root) return;
  var el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = message;
  root.appendChild(el);
  setTimeout(function () { el.remove(); }, 5000);
}
function setAuthError(message) {
  var el = $("authError");
  if (!el) { toast(message, "err"); return; }
  el.textContent = message;
  el.classList.remove("hidden");
}
function clearAuthError() {
  var el = $("authError");
  if (el) { el.textContent = ""; el.classList.add("hidden"); }
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast(t("Copied.", "Disalin."), "ok"); })
      .catch(function () { toast(t("Could not copy. Select it manually.", "Gagal menyalin. Salin manual."), "warn"); });
  } else {
    toast(t("Select and copy the password manually.", "Pilih dan salin password secara manual."), "warn");
  }
}
function setBusy(buttonId, busy, label) {
  var btn = $(buttonId);
  if (!btn) return;
  if (busy) {
    btn.dataset.original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> ' + (label || t("Please wait…", "Mohon tunggu…"));
  } else {
    btn.disabled = false;
    if (btn.dataset.original) btn.innerHTML = btn.dataset.original;
  }
}

function initApp() {
  initTheme();
  initLang();
  $("footerVersion").textContent = "v" + APP_VERSION + " · bank " + QUESTION_BANK.version;
  if (typeof firebase === "undefined") {
    renderFatal("Firebase SDK could not be loaded. Check your internet connection and refresh the page.");
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    SETTINGS_REF = db.collection("fundai_settings").doc("exam");
    serverTimestamp = firebase.firestore.FieldValue.serverTimestamp;
    increment = firebase.firestore.FieldValue.increment;
  } catch (err) {
    renderFatal("Firebase initialisation failed: " + err.message);
    return;
  }
  loadPublicSettings();
  var persistence = firebase.auth.Auth.Persistence.SESSION;
  auth.setPersistence(persistence).catch(function () {}).then(function () {
    auth.onAuthStateChanged(function (user) { handleAuthChanged(user); });
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && state.test && !state.test.submitted && state.test.startedAtMs) {
      state.test.tabSwitches = (state.test.tabSwitches || 0) + 1;
      saveDraftSoon();
    }
  });
  renderAuth();
}
function renderFatal(message) {
  $("app").innerHTML = '<div class="page-narrow"><div class="card"><h2 class="card-title">' +
    t("Unable to start", "Tidak dapat memulai") + '</h2><p class="card-sub">' + esc(message) + '</p></div></div>';
}
async function loadPublicSettings() {
  if (!db) return;
  try {
    var snap = await SETTINGS_REF.get();
    if (snap.exists) state.settings = Object.assign({}, DEFAULT_SETTINGS, snap.data());
    state.firestoreError = "";
  } catch (err) {
    state.firestoreError = err.code === "permission-denied"
      ? t("Firestore rules have not been published yet. Ask the admin to follow SETUP.md.", "Aturan Firestore belum dipublikasikan. Minta admin mengikuti SETUP.md.")
      : (err.message || String(err));
  }
  // If the settings read finishes after the first auth render, show the
  // warning (or clear it) without requiring the user to reload the page.
  if (!state.user && state.view === "auth") renderAuth();
}
async function handleAuthChanged(user) {
  if (state.registering) return;
  cleanupSubscriptions();
  state.user = user || null;
  state.isAdmin = !!(user && String(user.email || "").toLowerCase() === ADMIN_EMAIL);
  renderChrome();
  if (!user) {
    state.profile = null;
    state.view = "auth";
    renderAuth();
    return;
  }
  if (state.isAdmin) {
    state.view = "admin";
    await loadAdminData();
    return;
  }
  await bootstrapParticipant(user);
}
async function bootstrapParticipant(user) {
  try {
    state.profileRemoved = false;
    var ref = db.collection("fundai_participants").doc(user.uid);
    var snap = null;
    for (var attempt = 0; attempt < 3; attempt++) {
      snap = await ref.get();
      if (snap.exists) break;
      await new Promise(function (resolve) { setTimeout(resolve, 300); });
    }
    if (!snap || !snap.exists) {
      toast(t("Participant profile not found. Please contact the admin.", "Profil peserta tidak ditemukan. Hubungi admin."), "err");
      await auth.signOut();
      return;
    }
    state.profile = Object.assign({ id: snap.id }, snap.data());
    state.user = user;
    state.isAdmin = false;
    state.view = "dashboard";
    setupParticipantSubscriptions();
    renderChrome();
    if (state.profile.status === "disabled") { state.view = "blocked"; renderBlocked(); return; }
    renderParticipantDashboard();
    if (state.profile.mustChangePassword) showChangePassword(true);
    updateLastLogin();
    logAuditOnce("login");
  } catch (err) {
    state.firestoreError = err.code === "permission-denied"
      ? t("Cannot read your profile. Firestore rules may not be published yet.", "Tidak bisa membaca profil. Aturan Firestore mungkin belum dipublikasikan.")
      : (err.message || String(err));
    renderAuth();
  }
}
function updateLastLogin() {
  if (!state.profile || !state.user) return;
  db.collection("fundai_participants").doc(state.user.uid).update({
    lastLoginAt: serverTimestamp(),
    lastLoginAtMs: Date.now()
  }).catch(function () {});
}
function logAuditOnce(action) {
  var key = STORAGE_PREFIX + "logged_" + action + "_" + (state.user ? state.user.uid : "none");
  try {
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, "1");
  } catch (e) {}
  logAudit(action, "", {});
}
function cleanupSubscriptions() {
  state.unsubs.forEach(function (unsub) { try { unsub(); } catch (e) {} });
  state.unsubs = [];
  if (state.test && state.test.timerInterval) {
    clearInterval(state.test.timerInterval);
    state.test.timerInterval = null;
  }
}
function logAudit(action, targetNim, details) {
  if (!db || !state.user) return Promise.resolve();
  var actorRole = state.isAdmin ? "admin" : "participant";
  var label = state.isAdmin ? "admin" : (state.profile ? state.profile.name + " (" + state.profile.nim + ")" : state.user.email);
  return db.collection("fundai_audit_logs").add({
    actorUid: state.user.uid,
    actorEmail: state.user.email || "",
    actorRole: actorRole,
    actorLabel: label,
    action: action,
    targetNim: targetNim || (state.profile ? state.profile.nim : ""),
    targetUid: state.profile ? state.profile.uid : "",
    details: details || {},
    createdAt: serverTimestamp(),
    createdAtMs: Date.now(),
    appVersion: APP_VERSION
  }).catch(function () {});
}

function mapAuthError(err) {
  var code = String(err && err.code || "");
  var msg = String(err && err.message || "");
  if (code.indexOf("user-not-found") >= 0 || code.indexOf("wrong-password") >= 0 || code.indexOf("invalid-credential") >= 0 || code.indexOf("invalid-login-credentials") >= 0) {
    return t("Incorrect NIM/username or password.", "NIM/username atau password salah.");
  }
  if (code.indexOf("too-many-requests") >= 0) return t("Too many attempts. Wait a few minutes and try again.", "Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.");
  if (code.indexOf("email-already-in-use") >= 0) return t("This account already exists. Please login instead.", "Akun ini sudah ada. Silakan login.");
  if (code.indexOf("weak-password") >= 0) return t("Password is too weak. Use at least 8 characters with a letter and a number.", "Password terlalu lemah. Gunakan minimal 8 karakter dengan huruf dan angka.");
  if (code.indexOf("network") >= 0) return t("Network problem. Check your connection and try again.", "Masalah jaringan. Periksa koneksi lalu coba lagi.");
  if (code.indexOf("permission-denied") >= 0) return t("Firestore rules have not been published yet. Contact the admin.", "Aturan Firestore belum dipublikasikan. Hubungi admin.");
  if (msg === "NIM_NOT_REGISTERED") return t("This NIM is not registered. Create an account first.", "NIM ini belum terdaftar. Buat akun terlebih dahulu.");
  if (msg === "ACCOUNT_DISABLED") return t("This account is disabled. Contact the admin.", "Akun ini dinonaktifkan. Hubungi admin.");
  return msg || t("Something went wrong. Please try again.", "Terjadi kesalahan. Silakan coba lagi.");
}
async function handleParticipantLogin(event) {
  event.preventDefault();
  clearAuthError();
  var nim = normalizeNim(($("loginNim") || {}).value);
  var password = ($("loginPassword") || {}).value || "";
  if (!validNim(nim)) { setAuthError(t("Enter a valid NIM (6–20 letters/numbers).", "Masukkan NIM yang valid (6–20 huruf/angka).")); return false; }
  if (!password) { setAuthError(t("Enter your password.", "Masukkan password Anda.")); return false; }
  setBusy("loginBtn", true, t("Checking…", "Memeriksa…"));
  try {
    var idx = await db.collection("fundai_login_index").doc(nim).get();
    if (!idx.exists) throw new Error("NIM_NOT_REGISTERED");
    var data = idx.data();
    if (data.status === "disabled") throw new Error("ACCOUNT_DISABLED");
    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    await auth.signInWithEmailAndPassword(data.authEmail, password);
    // onAuthStateChanged takes over
  } catch (err) {
    setBusy("loginBtn", false);
    setAuthError(mapAuthError(err));
  }
  return false;
}
async function handleAdminLogin(event) {
  event.preventDefault();
  clearAuthError();
  var username = String(($("adminUser") || {}).value || "").trim().toLowerCase();
  var password = ($("adminPassword") || {}).value || "";
  var email = username.indexOf("@") >= 0 ? username : username + "@fundai.local";
  if (email !== ADMIN_EMAIL) {
    setAuthError(t("Invalid admin username or password.", "Username atau password admin salah."));
    return false;
  }
  if (!password) { setAuthError(t("Enter the admin password.", "Masukkan password admin.")); return false; }
  setBusy("adminLoginBtn", true, t("Checking…", "Memeriksa…"));
  try {
    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    setBusy("adminLoginBtn", false);
    setAuthError(mapAuthError(err));
  }
  return false;
}
async function handleRegister(event) {
  event.preventDefault();
  clearAuthError();
  var name = String(($("regName") || {}).value || "").trim();
  var nim = normalizeNim(($("regNim") || {}).value);
  var password = ($("regPassword") || {}).value || "";
  var password2 = ($("regPassword2") || {}).value || "";
  var terms = !!($("regTerms") && $("regTerms").checked);
  if (name.length < 2) { setAuthError(t("Enter your full name.", "Masukkan nama lengkap Anda.")); return false; }
  if (name.length > 120) { setAuthError(t("Your name is too long. Use at most 120 characters.", "Nama terlalu panjang. Gunakan maksimal 120 karakter.")); return false; }
  if (!validNim(nim)) { setAuthError(t("NIM must be 6–20 letters/numbers, without spaces.", "NIM harus 6–20 huruf/angka, tanpa spasi.")); return false; }
  if (!validPassword(password)) { setAuthError(t("Password must be at least 8 characters and include a letter and a number.", "Password minimal 8 karakter dan mengandung huruf serta angka.")); return false; }
  if (password !== password2) { setAuthError(t("The passwords do not match.", "Password tidak cocok.")); return false; }
  if (!terms) { setAuthError(t("You must agree to the Terms & Conditions.", "Anda harus menyetujui Syarat & Ketentuan.")); return false; }
  if (!state.settings.registrationOpen) { setAuthError(t("Registration is currently closed. Contact the admin.", "Pendaftaran sedang ditutup. Hubungi admin.")); return false; }
  setBusy("registerBtn", true, t("Creating account…", "Membuat akun…"));
  state.registering = true;
  var authEmail = participantEmail(nim);
  var createdUser = null;
  try {
    var existing = await db.collection("fundai_login_index").doc(nim).get();
    if (existing.exists) {
      state.registering = false;
      setBusy("registerBtn", false);
      setAuthError(t("This NIM is already registered. Please login or contact the admin.", "NIM ini sudah terdaftar. Silakan login atau hubungi admin."));
      return false;
    }
    var cred = await auth.createUserWithEmailAndPassword(authEmail, password);
    createdUser = cred.user;
    await createdUser.updateProfile({ displayName: name });
    var batch = db.batch();
    var indexRef = db.collection("fundai_login_index").doc(nim);
    var profileRef = db.collection("fundai_participants").doc(createdUser.uid);
    batch.set(indexRef, {
      nim: nim,
      uid: createdUser.uid,
      authEmail: authEmail,
      status: "active",
      createdAt: serverTimestamp(),
      createdAtMs: Date.now(),
      updatedAt: serverTimestamp(),
      appVersion: APP_VERSION
    });
    batch.set(profileRef, {
      uid: createdUser.uid,
      nim: nim,
      name: name,
      authEmail: authEmail,
      status: "active",
      mustChangePassword: false,
      termsVersion: TERMS_VERSION,
      termsAcceptedAt: serverTimestamp(),
      termsAcceptedAtMs: Date.now(),
      createdAt: serverTimestamp(),
      createdAtMs: Date.now(),
      lastLoginAt: serverTimestamp(),
      lastLoginAtMs: Date.now(),
      passwordChangedAtMs: 0,
      passwordResetCount: 0,
      realTestAttempted: false,
      practiceCompleted: [],
      appVersion: APP_VERSION
    });
    await batch.commit();
    state.registering = false;
    setBusy("registerBtn", false);
    toast(t("Account created. Welcome!", "Akun dibuat. Selamat datang!"), "ok");
    await bootstrapParticipant(createdUser);
  } catch (err) {
    state.registering = false;
    setBusy("registerBtn", false);
    try {
      if (createdUser) { await createdUser.delete(); }
      if (auth.currentUser) await auth.signOut();
    } catch (cleanupErr) {}
    setAuthError(mapAuthError(err));
  }
  return false;
}

function setupParticipantSubscriptions() {
  cleanupSubscriptions();
  if (!state.profile) return;
  var nim = state.profile.nim;
  state.unsubs.push(SETTINGS_REF.onSnapshot(function (snap) {
    if (snap.exists) state.settings = Object.assign({}, DEFAULT_SETTINGS, snap.data());
    if (state.view === "dashboard") renderParticipantDashboard();
    if (state.view === "result" && state.lastResult && state.lastResult.setId === "real") renderResult();
  }, function (err) { handleSnapshotError(err); }));
  state.unsubs.push(db.collection("fundai_participants").doc(state.profile.uid).onSnapshot(function (snap) {
    if (!snap.exists) {
      // The profile can disappear when an admin resets the password: the app
      // migrates the participant to a new Firebase Auth UID. End this stale
      // session and explain what happened.
      handleProfileRemoved();
      return;
    }
    state.profile = Object.assign({ id: snap.id }, snap.data());
    renderChrome();
    if (state.profile.status === "disabled") {
      state.view = "blocked";
      renderBlocked();
      return;
    }
    if (state.view === "dashboard") renderParticipantDashboard();
  }, function (err) { handleSnapshotError(err); }));
  state.unsubs.push(db.collection("fundai_submissions").where("nim", "==", nim).onSnapshot(function (snap) {
    state.submissions = snap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); })
      .sort(function (a, b) { return (b.submittedAtMs || 0) - (a.submittedAtMs || 0); });
    if (state.view === "dashboard") renderParticipantDashboard();
  }, function (err) { handleSnapshotError(err); }));
  PRACTICE_IDS.concat(["real"]).forEach(function (setId) {
    state.unsubs.push(db.collection("fundai_drafts").doc(nim + "_" + setId).onSnapshot(function (snap) {
      if (snap.exists) state.drafts[setId] = Object.assign({ id: snap.id }, snap.data());
      else delete state.drafts[setId];
      if (state.view === "dashboard") renderParticipantDashboard();
    }, function () {}));
  });
}
function handleSnapshotError(err) {
  if (err && err.code === "permission-denied") {
    state.firestoreError = t("Firestore rules have not been published. See SETUP.md.", "Aturan Firestore belum dipublikasikan. Lihat SETUP.md.");
    toast(state.firestoreError, "err");
  }
}

function xmur3(str) {

    h = Math.imul(h ^ (h >>> 13), 3266489909);

}

}
function identityOrder(n) {

}

function packOptOrder(rows) {

async function startTest(setId) {

    if (Array.isArray(cloudDraft.questionTimings) && cloudDraft.questionTimings.length === set.questions.length) timings = cloudDraft.questionTimings.slice();

    startedAtMs: startedAtMs,
    timerMinutes: timerMinutes,
    timerRemaining: timerRemaining,

    questionTimings: timings,

function formatClock(totalSeconds) {

function tickTimer() {

  if (state.test.graded) {
    var elapsed = Math.floor((Date.now() - state.test.startedAtMs) / 1000);
    state.test.timerRemaining = Math.max(0, state.test.timerMinutes * 60 - elapsed);
    if (state.test.timerRemaining <= 0 && !state.test.autoSubmitting) {
      state.test.autoSubmitting = true;
      toast(t("Time is up. Your test is being submitted.", "Waktu habis. Tes Anda sedang dikumpulkan."), "warn");
      submitTest(true);
      return;
    }
  }
  updateTimerDisplay();
}
function updateTimerDisplay() {

    var box = $("timerBox");
    if (box) {
      box.classList.toggle("warn", state.test.timerRemaining <= 600 && state.test.timerRemaining > 300);
      box.classList.toggle("danger", state.test.timerRemaining <= 300);

function recomputeScore(submission) {
  var set = QUESTION_BANK.sets[submission.setId];
  if (!set || !Array.isArray(submission.qOrder) || !Array.isArray(submission.answers)) return null;
  var score = 0;
  for (var i = 0; i < submission.qOrder.length; i++) {
    var q = set.questions[submission.qOrder[i]];
    if (q && submission.answers[i] === q.answer) score++;
  }
  var total = set.questions.length;
  return { score: score, total: total, percentage: Math.round(score / total * 100) };
}
async function submitTest(auto) {
  if (!state.test || state.test.submitting || state.test.submitted) return;
  state.test.submitting = true;
  if (state.test.timerInterval) { clearInterval(state.test.timerInterval); state.test.timerInterval = null; }
  recordQuestionTime();
  var test = state.test;
  var set = test.set;
  var score = 0;
  for (var i = 0; i < test.qOrder.length; i++) {
    var q = set.questions[test.qOrder[i]];
    if (test.answers[i] === q.answer) score++;
  }
  var total = set.questions.length;
  var percentage = Math.round(score / total * 100);
  var passed = set.graded ? percentage >= Number(state.settings.passPercent || 60) : null;
  var docId = set.graded ? ("real_" + state.profile.nim) : ("practice_" + test.setId + "_" + state.profile.nim);
  var duration = Math.max(0, Math.round((Date.now() - test.startedAtMs) / 1000));
  var data = {
    uid: state.profile.uid,
    nim: state.profile.nim,
    name: state.profile.name,
    setId: test.setId,
    graded: !!set.graded,
    score: score,
    total: total,
    percentage: percentage,
    passed: passed,
    passPercent: set.graded ? Number(state.settings.passPercent || 60) : null,
    answers: test.answers.slice(),
    qOrder: test.qOrder.slice(),
    optOrder: packOptOrder(test.optOrder),
    flags: test.flags.slice(),
    questionTimings: test.questionTimings.slice(),
    tabSwitches: test.tabSwitches || 0,
    answerChanges: test.answerChanges.slice(),
    startedAtMs: test.startedAtMs,
    submittedAt: serverTimestamp(),
    submittedAtMs: Date.now(),
    durationSeconds: duration,
    timerMinutes: test.timerMinutes,
    autoSubmitted: !!auto,
    questionBankVersion: QUESTION_BANK.version,
    questionBankHash: QUESTION_BANK.hash,
    appVersion: APP_VERSION,
    termsVersion: state.profile.termsVersion || TERMS_VERSION,
    termsAcceptedAtMs: state.profile.termsAcceptedAtMs || 0,
    userAgent: navigator.userAgent
  };
  try {
    await db.collection("fundai_submissions").doc(docId).set(data);
    test.submitted = true;
    if (test.saveTimer) clearTimeout(test.saveTimer);
    try { await test.draftRef.delete(); } catch (e) {}
    clearLocalDraft(test.setId);
    data.id = docId;
    data.submittedAt = new Date(data.submittedAtMs);
    state.lastResult = data;
    state.test = null;
    state.view = "result";
    renderResult();
    logAudit(set.graded ? "real_submit" : "practice_submit", state.profile.nim, {
      setId: test.setId, score: score, total: total, percentage: percentage, auto: !!auto
    });
    toast(t("Submitted successfully.", "Berhasil dikumpulkan."), "ok");
  } catch (err) {
    test.submitting = false;
    test.autoSubmitting = false;
    // If the deterministic document already exists, this was a duplicate attempt.
    try {
      var existing = await db.collection("fundai_submissions").doc(docId).get();
      if (existing.exists) {
        state.lastResult = Object.assign({ id: existing.id }, existing.data());
        state.test = null;
        state.view = "result";
        renderResult();
        toast(t("This attempt was already submitted. Showing the saved result.", "Percobaan ini sudah dikumpulkan. Menampilkan hasil tersimpan."), "warn");
        return;
      }
    } catch (e2) {}
    var message = mapAuthError(err) + " " + t("Your answers are still on this device. Try submitting again.", "Jawaban masih tersimpan di perangkat ini. Coba kumpulkan lagi.");
    toast(message, "err");
    if (test.graded && test.timerRemaining <= 0) {
      // Time is up. Do not restart the countdown, because that would retry
      // the submission in an endless loop. Keep the attempt open with an
      // explicit retry button instead.
      test.autoSubmitting = true;
      test.submitError = message;
      if (test.timerInterval) { clearInterval(test.timerInterval); test.timerInterval = null; }
      showSubmitRetry(message);
    } else if (test.graded) {
      startTimer();
    }
  }
}
function showSubmitRetry(message) {

function resultCanShowAnswers(result) {

  } else {

  }
  $("app").innerHTML = '<div class="page-narrow"><div class="card">' +
    '<div class="result-hero"><div class="result-label">' + esc(set.label) + '</div>' +
      '<div class="score-circle ' + cls + '">' + r.percentage + '</div>' +
      '<div class="result-label">' + label + '</div>' +

      '<div class="result-sub">' + esc(r.name || "") + ' · NIM ' + esc(r.nim || "") + '</div>' +
      '<div class="result-sub">' + fmtDate(r.submittedAtMs) + ' · ' + fmtDuration(r.durationSeconds) + ' · ' + (r.tabSwitches || 0) + ' ' + t("tab switch(es)", "perpindahan tab") + '</div>' +
      '<div class="result-actions"><button class="btn btn-outline btn-sm" onclick="goHome()">← ' + t("Dashboard", "Dasbor") + '</button>' +
        '<button class="btn btn-outline btn-sm" onclick="window.print()">🖨 ' + t("Print", "Cetak") + '</button></div></div>' +
    detail +
    '</div></div>';
}
function buildBreakdown(submission, showAnswers) {
  var set = QUESTION_BANK.sets[submission.setId];
  if (!set) return "";
  var html = '<div class="breakdown">';
  for (var i = 0; i < submission.qOrder.length; i++) {
    var orig = submission.qOrder[i];
    var q = set.questions[orig];
    if (!q) continue;
    var selected = submission.answers ? submission.answers[i] : null;
    var isCorrect = selected === q.answer;
    html += '<div class="bq"><div class="bq-top"><span class="bq-text">' + (i + 1) + '. ' + esc(q.text) + '</span>' +
      '<span class="bq-status ' + (isCorrect ? "ok" : "no") + '">' + (isCorrect ? "✓ " + t("Correct", "Benar") : "✗ " + t("Wrong", "Salah")) + '</span></div>';
    if (showAnswers) {
      html += '<ul>';
      for (var oi = 0; oi < q.options.length; oi++) {
        var cls = "";
        if (oi === q.answer) cls = "correct";
        else if (oi === selected) cls = "wrong";
        var marker = oi === q.answer ? " ✓" : (oi === selected && !isCorrect ? " ✗" : "");
        html += '<li class="' + cls + '">' + LETTERS[oi] + '. ' + esc(q.options[oi]) + marker + '</li>';
      }
      if (selected === null || selected === undefined) {
        html += '<li class="wrong">' + t("No answer selected", "Tidak ada jawaban dipilih") + '</li>';
      }
      html += '</ul>';
      if (submission.questionTimings && submission.questionTimings[i] != null) {
        html += '<div class="tiny mt-8">' + t("Time on this question", "Waktu pada soal ini") + ': ' + fmtDuration(submission.questionTimings[i]) + '</div>';
      }
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

async function handleChangePassword(event, forced) {
  event.preventDefault();
  var errEl = $("pwError");
  function fail(msg) { if (errEl) { errEl.textContent = msg; errEl.classList.remove("hidden"); } else toast(msg, "err"); }
  var current = ($("pwCurrent") || {}).value || "";
  var next = ($("pwNew") || {}).value || "";
  var next2 = ($("pwNew2") || {}).value || "";
  if (!current) { fail(t("Enter your current password.", "Masukkan password saat ini.")); return false; }
  if (!validPassword(next)) { fail(t("New password must be at least 8 characters and include a letter and a number.", "Password baru minimal 8 karakter dan mengandung huruf serta angka.")); return false; }
  if (next !== next2) { fail(t("The new passwords do not match.", "Password baru tidak cocok.")); return false; }
  setBusy("pwSubmit", true, t("Saving…", "Menyimpan…"));
  try {
    var user = auth.currentUser;
    var credential = firebase.auth.EmailAuthProvider.credential(user.email, current);
    await user.reauthenticateWithCredential(credential);
    await user.updatePassword(next);
    await db.collection("fundai_participants").doc(user.uid).update({
      mustChangePassword: false,
      passwordChangedAtMs: Date.now(),
      passwordChangedAt: serverTimestamp()
    });
    if (state.profile) {
      state.profile.mustChangePassword = false;
      state.profile.passwordChangedAtMs = Date.now();
    }
    closeModal();
    toast(t("Password updated.", "Password diperbarui."), "ok");
    logAudit("password_change", state.profile ? state.profile.nim : "", { forced: !!forced });
    if (state.view === "dashboard") renderParticipantDashboard();
  } catch (err) {
    setBusy("pwSubmit", false);
    fail(mapAuthError(err));
  }
  return false;
}

function practiceSubmissions() {

}
function realSubmissionForNim(nim) {
  for (var i = 0; i < state.allSubmissions.length; i++) {
    if (state.allSubmissions[i].nim === nim && state.allSubmissions[i].setId === "real") return state.allSubmissions[i];
  }
  return null;
}
function practiceCompletedForNim(nim) {
  var done = {};
  state.allSubmissions.forEach(function (s) {
    if (s.nim === nim && s.setId !== "real") done[s.setId] = true;
  });
  return done;
}
function statusBadge(status) {
  if (status === "active") return '<span class="badge badge-open">' + t("Active", "Aktif") + '</span>';
  if (status === "disabled") return '<span class="badge badge-closed">' + t("Disabled", "Nonaktif") + '</span>';
  return '<span class="badge badge-muted">' + esc(status || "—") + '</span>';
}

  var passCount = realSubs.filter(function (s) { return s.passed; }).length;

function setAdminSearch(value) {
  // The results table is re-rendered on every keystroke, so remember the
  // caret position and put it back on the fresh input element.
  var oldInput = document.querySelector('#adminContent .toolbar input[type="text"]');
  var caret = oldInput ? oldInput.selectionStart : null;
  state.adminFilters.search = value;
  refreshAdminContent();
  var input = document.querySelector('#adminContent .toolbar input[type="text"]');
  if (input) {
    try {
      input.focus();
      var pos = caret == null ? input.value.length : Math.min(caret, input.value.length);
      input.setSelectionRange(pos, pos);
    } catch (e) {}
  }
}

function toLocalInput(ms) {
  if (!ms) return "";
  var d = new Date(ms);
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
async function saveSettings(event) {
  event.preventDefault();
  var openAt = $("setOpenAt").value ? new Date($("setOpenAt").value) : null;
  var closeAt = $("setCloseAt").value ? new Date($("setCloseAt").value) : null;
  if (openAt && isNaN(openAt.getTime())) { toast(t("Invalid opening time.", "Waktu buka tidak valid."), "err"); return false; }
  if (closeAt && isNaN(closeAt.getTime())) { toast(t("Invalid closing time.", "Waktu tutup tidak valid."), "err"); return false; }
  if (openAt && closeAt && closeAt <= openAt) { toast(t("Closing time must be after opening time.", "Waktu tutup harus setelah waktu buka."), "err"); return false; }
  var timerMinutes = Number($("setTimer").value);
  var passPercent = Number($("setPass").value);
  if (!(timerMinutes >= 5 && timerMinutes <= 180)) { toast(t("Timer must be between 5 and 180 minutes.", "Waktu harus antara 5 dan 180 menit."), "err"); return false; }
  if (!(passPercent >= 0 && passPercent <= 100)) { toast(t("Pass mark must be between 0 and 100.", "Nilai lulus harus antara 0 dan 100."), "err"); return false; }
  var patch = {
    registrationOpen: $("setRegistration").value === "true",
    practiceEnabled: $("setPractice").value === "true",
    realTestOpen: $("setRealOpen").value === "true",
    timerMinutes: timerMinutes,
    passPercent: passPercent,
    shuffleReal: $("setShuffle").value === "true",
    realTestOpenAt: openAt ? firebase.firestore.Timestamp.fromDate(openAt) : null,
    realTestCloseAt: closeAt ? firebase.firestore.Timestamp.fromDate(closeAt) : null,
    realAnswersReleased: $("setAnswers").value === "true"
  };
  try {
    await saveSettingsPatch(patch);
    state.settingsDirty = false;
    toast(t("Settings saved.", "Pengaturan disimpan."), "ok");
    logAudit("settings_change", "", patch);
    renderAdmin();
  } catch (err) {
    toast(mapAuthError(err), "err");
  }
  return false;
}
async function saveSettingsPatch(patch) {
  var data = Object.assign({}, patch, {
    updatedAt: serverTimestamp(),
    updatedAtMs: Date.now(),
    updatedBy: state.user ? state.user.uid : "",
    appVersion: APP_VERSION
  });
  await SETTINGS_REF.set(data, { merge: true });
  state.settings = Object.assign({}, state.settings, patch);
}
async function openRealNow() {
  try {
    // Clear any previous closing time. A stale close time in the past would
    // otherwise make the test appear open in settings but closed for students.
    await saveSettingsPatch({
      realTestOpen: true,
      realTestOpenAt: firebase.firestore.Timestamp.fromDate(new Date()),
      realTestCloseAt: null
    });
    toast(t("Real test opened.", "Tes asli dibuka."), "ok");
    logAudit("real_test_open", "", {});
    state.settingsDirty = false;
    renderAdmin();
  } catch (err) { toast(mapAuthError(err), "err"); }
}
async function closeRealNow() {
  try {
    await saveSettingsPatch({ realTestOpen: false });
    toast(t("Real test closed.", "Tes asli ditutup."), "ok");
    logAudit("real_test_close", "", {});
    state.settingsDirty = false;
    renderAdmin();
  } catch (err) { toast(mapAuthError(err), "err"); }
}
async function setAnswersReleased(released) {
  try {
    await saveSettingsPatch({ realAnswersReleased: !!released });
    toast(released ? t("Answers released.", "Jawaban dirilis.") : t("Answers locked.", "Jawaban dikunci."), "ok");
    logAudit(released ? "answers_release" : "answers_lock", "", {});
    state.settingsDirty = false;
    renderAdmin();
  } catch (err) { toast(mapAuthError(err), "err"); }
}

async function doResetPassword(event, nim) {

  var temp = $("resetTemp").value.trim();
  if (!validPassword(temp)) { fail(t("Temporary password must be at least 8 characters and include a letter and a number.", "Password sementara minimal 8 karakter dan mengandung huruf serta angka.")); return false; }
  var p = state.participants.find(function (x) { return x.nim === nim; });
  if (!p) { fail(t("Participant not found.", "Peserta tidak ditemukan.")); return false; }
  setBusy("resetBtn", true, t("Resetting…", "Mereset…"));
  var helper = null;
  try {
    var newEmail = participantEmail(nim);
    try { helper = firebase.app("fundai-reset-helper"); } catch (e) { helper = firebase.initializeApp(FIREBASE_CONFIG, "fundai-reset-helper"); }
    var helperAuth = helper.auth();
    await helperAuth.setPersistence(firebase.auth.Auth.Persistence.NONE);
    var cred = await helperAuth.createUserWithEmailAndPassword(newEmail, temp);
    var newUid = cred.user.uid;
    await helperAuth.signOut();
    try { await helper.delete(); } catch (e) {}
    helper = null;
    var batch = db.batch();
    var oldRef = db.collection("fundai_participants").doc(p.uid || p.id);
    var newRef = db.collection("fundai_participants").doc(newUid);
    var newProfile = {
      uid: newUid,
      nim: p.nim,
      name: p.name,
      authEmail: newEmail,
      status: "active",
      mustChangePassword: true,
      termsVersion: p.termsVersion || TERMS_VERSION,
      termsAcceptedAt: p.termsAcceptedAt || null,
      termsAcceptedAtMs: p.termsAcceptedAtMs || 0,
      createdAt: p.createdAt || serverTimestamp(),
      createdAtMs: p.createdAtMs || Date.now(),
      lastLoginAt: p.lastLoginAt || null,
      lastLoginAtMs: p.lastLoginAtMs || 0,
      passwordChangedAtMs: p.passwordChangedAtMs || 0,
      passwordResetCount: (p.passwordResetCount || 0) + 1,
      lastPasswordResetAtMs: Date.now(),
      lastPasswordResetBy: state.user.uid,
      realTestAttempted: !!realSubmissionForNim(nim),
      practiceCompleted: PRACTICE_IDS.filter(function (id) { return !!state.allSubmissions.find(function (s) { return s.nim === nim && s.setId === id; }); }),
      appVersion: APP_VERSION
    };
    batch.set(newRef, newProfile);
    batch.set(db.collection("fundai_login_index").doc(nim), {
      nim: nim, uid: newUid, authEmail: newEmail, status: "active",
      updatedAt: serverTimestamp(), updatedAtMs: Date.now()
    }, { merge: true });
    batch.delete(oldRef);
    PRACTICE_IDS.concat(["real"]).forEach(function (setId) {
      batch.delete(db.collection("fundai_drafts").doc(nim + "_" + setId));
    });
    await batch.commit();
    setBusy("resetBtn", false);
    closeModal();
    logAudit("password_reset", nim, { newUid: newUid, orphanedOldUid: p.uid || p.id });
    showModal(
      '<button class="close-x" onclick="closeModal()">×</button><h3>' + t("Temporary password created", "Password sementara dibuat") + '</h3>' +
      '<p>' + t("Give this to", "Berikan ini kepada") + ' <b>' + esc(p.name) + '</b> (' + esc(nim) + '). ' + t("It will not be shown again.", "Password ini tidak akan ditampilkan lagi.") + '</p>' +
      '<div class="temp-pw"><code>' + esc(temp) + '</code><button class="btn btn-outline btn-sm" onclick="copyText(\'' + esc(temp) + '\')">' + t("Copy", "Salin") + '</button></div>' +
      '<p class="small">' + t("The participant must change this password immediately after login. The old Firebase Auth account cannot be deleted from a static site; it is no longer linked to this NIM.", "Peserta harus segera mengganti password ini setelah login. Akun Firebase Auth lama tidak dapat dihapus dari situs statis; akun itu tidak lagi terhubung ke NIM ini.") + '</p>' +
      '<div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">' + t("Done", "Selesai") + '</button></div>'
    );
  } catch (err) {
    setBusy("resetBtn", false);
    if (helper) { try { await helper.delete(); } catch (e) {} }
    fail(mapAuthError(err));
  }
  return false;
}

function buildAdminBreakdown(s) {
  var set = QUESTION_BANK.sets[s.setId];
  if (!set) return "";
  var html = '<div class="breakdown">';
  for (var i = 0; i < s.qOrder.length; i++) {
    var q = set.questions[s.qOrder[i]];
    if (!q) continue;
    var selected = s.answers[i];
    var correct = selected === q.answer;
    html += '<div class="bq"><div class="bq-top"><span class="bq-text">' + (i + 1) + '. ' + esc(q.text) + '</span><span class="bq-status ' + (correct ? "ok" : "no") + '">' + (correct ? "✓" : "✗") + '</span></div>' +
      '<div class="src tiny">' + t("Source", "Sumber") + ': ' + esc(q.source) + ' · ' + t("Meeting", "Pertemuan") + ' ' + q.meeting + ' · ' + t("Original Q", "Q asli") + ' ' + q.no + '</div><ul>';
    for (var oi = 0; oi < q.options.length; oi++) {
      var cls = oi === q.answer ? "correct" : (oi === selected ? "wrong" : "");
      html += '<li class="' + cls + '">' + LETTERS[oi] + '. ' + esc(q.options[oi]) + (oi === q.answer ? " ✓" : (oi === selected ? " ← " + t("chosen", "dipilih") : "")) + '</li>';
    }
    if (selected === null || selected === undefined) html += '<li class="wrong">' + t("No answer selected", "Tidak ada jawaban") + '</li>';
    html += '</ul><div class="tiny mt-8">' + t("Time", "Waktu") + ': ' + fmtDuration((s.questionTimings || [])[i]) + '</div></div>';
  }
  html += '</div>';
  return html;
}

  var v = String(value == null ? "" : value);
  // Neutralise spreadsheet formula injection from participant-controlled
  // names or NIMs (=, +, -, @, tab, CR at the start of a cell).
  if (/^[=+\-@\t\r]/.test(v)) v = "'" + v;
  v = v.replace(/"/g, '""');
  if (/[",\n\r]/.test(v)) v = '"' + v + '"';
  return v;
}
function downloadFile(filename, content, mime) {
  var blob = new Blob([content], { type: mime || "text/plain;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function exportResultsCSV() {
  if (!state.isAdmin) return;
  var headers = ["NIM", "Name", "Set", "Score", "Total", "Percentage", "Passed", "Submitted", "DurationSeconds", "TabSwitches", "AutoSubmitted", "BankVersion", "Integrity"];
  var rows = [headers];
  state.allSubmissions.forEach(function (s) {
    var re = recomputeScore(s);
    rows.push([
      s.nim, s.name, s.setId, s.score, s.total, s.percentage,
      s.setId === "real" ? (s.passed ? "PASS" : "FAIL") : "PRACTICE",
      new Date(s.submittedAtMs || tsToMs(s.submittedAt)).toISOString(),
      s.durationSeconds, s.tabSwitches || 0, s.autoSubmitted ? "yes" : "no",
      s.questionBankVersion || "",
      re ? (re.score === s.score && re.percentage === s.percentage ? "verified" : "mismatch") : "n/a"
    ]);
  });
  var csv = "\uFEFF" + rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n");
  downloadFile("fundai_results_" + new Date().toISOString().slice(0, 10) + ".csv", csv, "text/csv;charset=utf-8;");
  logAudit("export_results_csv", "", { rows: state.allSubmissions.length });
}
function exportParticipantsCSV() {
  if (!state.isAdmin) return;
  var headers = ["NIM", "Name", "Status", "Registered", "LastLogin", "TermsVersion", "PasswordResets", "PracticeCompleted", "RealScore", "RealResult"];
  var rows = [headers];
  state.participants.forEach(function (p) {
    var real = realSubmissionForNim(p.nim);
    rows.push([
      p.nim, p.name, p.status,
      new Date(p.createdAtMs || tsToMs(p.createdAt)).toISOString(),
      p.lastLoginAtMs ? new Date(p.lastLoginAtMs).toISOString() : "",
      p.termsVersion || "", p.passwordResetCount || 0,
      PRACTICE_IDS.filter(function (id) { return !!state.allSubmissions.find(function (s) { return s.nim === p.nim && s.setId === id; }); }).join("|"),
      real ? real.percentage : "",
      real ? (real.passed ? "PASS" : "FAIL") : ""
    ]);
  });
  var csv = "\uFEFF" + rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\r\n");
  downloadFile("fundai_participants_" + new Date().toISOString().slice(0, 10) + ".csv", csv, "text/csv;charset=utf-8;");
  logAudit("export_participants_csv", "", { rows: state.participants.length });
}
function exportBackupJSON() {
  if (!state.isAdmin) return;
  var backup = {
    exportedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
    questionBankVersion: QUESTION_BANK.version,
    questionBankHash: QUESTION_BANK.hash,
    settings: state.settings,
    participants: state.participants,
    submissions: state.allSubmissions,
    auditLogs: state.auditLogs
  };
  downloadFile("fundai_backup_" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(backup, null, 2), "application/json;charset=utf-8;");
  logAudit("export_backup_json", "", { submissions: state.allSubmissions.length, participants: state.participants.length });
}
function confirmClearSubmissions() {
  showModal(
    '<h3>' + t("Clear all submissions?", "Hapus semua pengumpulan?") + '</h3>' +
    '<p>' + t("This permanently deletes every practice and real-test result. Participant accounts and the audit log are kept. Export a backup first.", "Ini menghapus permanen semua hasil latihan dan tes asli. Akun peserta dan log audit tetap disimpan. Ekspor backup terlebih dahulu.") + '</p>' +
    '<div class="alert alert-error">' + t("This cannot be undone from the browser.", "Ini tidak dapat dibatalkan dari browser.") + '</div>' +
    '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">' + t("Cancel", "Batal") + '</button>' +
    '<button class="btn btn-danger" onclick="clearAllSubmissions()">' + t("Delete all submissions", "Hapus semua pengumpulan") + '</button></div>'
  );
}
async function clearAllSubmissions() {
  try {
    var docs = state.allSubmissions.slice();
    for (var i = 0; i < docs.length; i += 450) {
      var batch = db.batch();
      docs.slice(i, i + 450).forEach(function (s) { batch.delete(db.collection("fundai_submissions").doc(s.id)); });
      await batch.commit();
    }
    closeModal();
    logAudit("clear_submissions", "", { deleted: docs.length });
    toast(t("All submissions deleted.", "Semua pengumpulan dihapus."), "ok");
    renderAdmin();
  } catch (err) { toast(mapAuthError(err), "err"); }
}
